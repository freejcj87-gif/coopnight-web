<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>꼬꼬마을 · 설치 없이 플레이</title>
<link rel="preload" as="image" href="Art/logo.png"><link rel="preload" as="image" href="Art/loading-background.jpg" fetchpriority="low">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#253e34;color:#faf8e9;font:14px system-ui,sans-serif}header{height:48px;display:flex;align-items:center;justify-content:center;gap:18px;padding:6px}button{border:0;border-radius:12px;background:#f2d37f;color:#253e34;padding:10px 14px;cursor:pointer;font:inherit;font-weight:700}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #fff;outline-offset:3px}main{position:relative;margin:auto;width:min(100vw,calc((100dvh - 48px) * .5625));height:calc(100dvh - 48px);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}canvas{display:block;width:100%;height:100%;background:#faf6e9;touch-action:none;outline:none}
/* ART-webwelcome 2026-10-15: B1 key art as the welcome backdrop, B2 meadow + logo for loading. The art is chosen by the real
   container aspect (main), not the viewport: main stays 9:16 on PC today, so portrait is the default and landscape only
   switches in when main itself becomes wider than tall. Text sits on paper chips so it stays readable over the painting. */
#loading,#welcome{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#253e34;padding:22px 24px;gap:12px;background:#e4efce center 46%/cover no-repeat}
#welcome{justify-content:space-between;background-image:url(Art/welcome-portrait.jpg)}
main[data-art="landscape"] #welcome{background-image:url(Art/welcome-landscape.jpg);background-position:center;align-items:flex-start;padding-left:5%}
main[data-art="landscape"] .stack{width:min(420px,42%)}
#loading{justify-content:center;background-image:url(Art/loading-background.jpg);gap:18px}
#loading{pointer-events:none}.stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}.logo{width:min(66%,300px);height:auto;margin-top:2%;filter:drop-shadow(0 4px 10px rgba(40,60,45,.28))}#loading .logo{width:min(58%,260px);margin:0}
.bar{width:min(80%,320px);height:14px;border-radius:999px;background:#d8dcc6;border:1px solid #b9c2a6;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}#loadfill{height:100%;width:0;border-radius:999px;background:linear-gradient(#f7d37f,#e2b24a);transition:width .2s}#loading[hidden],#welcome[hidden],#error[hidden]{display:none}h1{margin:0;line-height:0}p{line-height:1.7;margin:0}
.chip{padding:8px 14px;background:rgba(255,253,244,.88);border:1px solid rgba(199,207,179,.9);border-radius:14px;box-shadow:0 3px 0 rgba(30,50,36,.12);backdrop-filter:blur(2px)}.journey{padding:12px 16px;font-size:14px;width:100%}
#play{width:100%;min-height:56px;background:linear-gradient(#f7d986,#e2b24a);color:#2b3f35;font-size:19px;border:2px solid #9a6f1e;border-radius:14px;box-shadow:0 4px 0 rgba(90,60,10,.30),inset 0 2px 0 rgba(255,255,255,.45)}#play:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(90,60,10,.30)}.small{font-size:12px}#preview{color:#315f4b;font-weight:bold}#error{position:absolute;inset:10%;background:#faf6e9;color:#7d2e26;padding:24px;overflow:auto;border-radius:16px}
</style></head><body>
<header><span>꼬꼬마을 · v0.41.0</span><button id="refresh" type="button" disabled>저장 후 새 버전</button></header>
<main data-art="portrait"><canvas id="unity-canvas" width="540" height="960" tabindex="0" aria-label="꼬꼬마을 게임 화면, 마우스 또는 손가락으로 드래그하여 이동"></canvas>
<section id="welcome" aria-label="게임 시작"><div class="stack"><h1><img class="logo" src="Art/logo.png" alt="꼬꼬마을" width="1024" height="512"></h1><p class="chip">작은 농장에서 시작하는 우리 마을의 모험</p></div><div class="stack"><div class="journey chip">가까이 가면 달걀이 머리 위로!<br>시장에 가져가면 자동으로 골드!<br>농장을 키우고 여덟 밤을 지켜 주세요.<br>그다음엔 부대를 이끌고 숲으로!</div><button id="play" type="button">농장으로 가기</button><a href="?showcase=1" id="preview" class="chip">30초 아트·손맛 미리보기 →</a><p class="small chip">끌어서 이동 · 놓으면 정지 · 시설은 탭<br>PC에서는 마우스 하나면 돼요.<br>진행은 이 브라우저에 자동 저장됩니다.</p></div></section>
<div id="loading" role="status" hidden><img class="logo" src="Art/logo.png" alt="꼬꼬마을" width="1024" height="512"><p id="loadtext" class="chip">농장을 준비하고 있어요… 0%</p><div class="bar"><div id="loadfill"></div></div><p class="small chip">첫 로딩은 몇 초 걸려요</p></div><div id="error" role="alert" hidden></div></main>
<script src="Build/Web.loader.js"></script><script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading'),error=document.getElementById('error');
const refresh=document.getElementById('refresh'),play=document.getElementById('play'),welcome=document.getElementById('welcome');let gameInstance=null;
// Pick the welcome art by the container's own aspect (main), so a future wide PC layout gets the landscape painting automatically.
const frame=document.querySelector('main');const pickArt=()=>{const r=frame.getBoundingClientRect();frame.dataset.art=r.width>r.height?'landscape':'portrait';};pickArt();
if(window.ResizeObserver)new ResizeObserver(pickArt).observe(frame);else window.addEventListener('resize',pickArt);
const isShowcase=new URLSearchParams(location.search).get("showcase")==="1";if(isShowcase){play.textContent="30초 장면 보기";document.getElementById("preview").href=location.pathname;document.getElementById("preview").textContent="본 게임으로 돌아가기";document.querySelector(".small").textContent="자동으로 수집·운반·판매를 보여드립니다. 기존 농장 저장은 변경하지 않습니다.";refresh.textContent="장면 다시 불러오기";}
refresh.onclick=()=>{if(isShowcase){location.reload();return;}if(gameInstance)gameInstance.SendMessage('Farm game','SaveBeforeReload');};
play.onclick=()=>{play.disabled=true;welcome.hidden=true;loading.hidden=false;
createUnityInstance(canvas,{
 autoSyncPersistentDataPath:true,arguments:[],dataUrl:'Build/Web.data',frameworkUrl:'Build/Web.framework.js',codeUrl:'Build/Web.wasm',streamingAssetsUrl:'StreamingAssets',
 companyName:"Little Coop",productName:"Coop Night",productVersion:"0.41.0",devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)
},p=>{document.getElementById('loadtext').textContent='농장을 준비하고 있어요… '+Math.round(p*100)+'%';document.getElementById('loadfill').style.width=Math.round(p*100)+'%';}).then(instance=>{gameInstance=instance;refresh.disabled=false;loading.hidden=true;canvas.focus();}).catch(e=>{loading.hidden=true;error.hidden=false;error.textContent='게임을 불러오지 못했어요. Chrome에서 새로고침해 주세요. '+String(e);});};
</script></body></html>
